name: Generate pinned npm lockfile
on:
  push:
    branches: ["feature/production-stabilization-v1"]
    paths:
      - "package.json"
      - ".github/workflows/dependency-lock.yml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve full dependency tree from pinned direct versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Check exact dependency manifest and lock
        run: |
          node - <<'JS'
          const fs=require('node:fs'), p=JSON.parse(fs.readFileSync('package.json','utf8'));
          const l=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for(const [name,version] of Object.entries(p.dependencies)) {
            if (l.packages['node_modules/'+name]?.version!==version) {
              throw new Error('Lock mismatch: '+name+' '+version);
            }
          }
          JS
      - name: Commit generated lockfile to the development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'lock(deps): freeze tested HyperFrames/GSAP npm dependency graph [skip ci]'
            git pull --rebase origin feature/production-stabilization-v1
            git push origin HEAD:feature/production-stabilization-v1
          fi
