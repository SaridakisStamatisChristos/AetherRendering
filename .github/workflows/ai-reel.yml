name: AI Video — HyperFrames + Kokoro

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video topic'
        required: true
        default: 'How an AI video renderer works'
      provider:
        description: 'demo = no API key; gemini = API-generated storyboard'
        type: choice
        options: [demo, gemini]
        default: demo
      model:
        description: 'auto or a model listed in config/gemini_router.json'
        default: 'auto'
      complexity:
        description: 'Routing tier (auto selects from topic and duration)'
        type: choice
        options: [auto, simple, standard, complex]
        default: auto
      seconds:
        description: 'Target length (6-120); actual length follows narration'
        default: '25'
      voice:
        description: 'Kokoro voice ID'
        default: 'af_heart'
      render_video:
        description: 'Render MP4 or generate compositions only'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ai-reel-usage-ledger
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
      - name: Unit tests (does not call Gemini)
        run: python -m unittest discover -s tests -v
      - name: Preflight API secret
        env:
          PROVIDER: ${{ inputs.provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "$PROVIDER" = "gemini" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo 'GEMINI_API_KEY missing: add it in Actions secrets.' >&2
            exit 1
          fi
      - name: Generate scene plan with model router
        env:
          TOPIC: ${{ inputs.topic }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          COMPLEXITY: ${{ inputs.complexity }}
          SECONDS: ${{ inputs.seconds }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python src/ai_director.py --topic "$TOPIC" --duration "$SECONDS" \
            --provider "$PROVIDER" --model "$MODEL" --complexity "$COMPLEXITY" \
            --router-config config/gemini_router.json \
            --usage-state state/gemini_usage.json --router-audit build/gemini_router_audit.json \
            --out build/video_plan.json
      - name: Persist Gemini usage BEFORE rendering
        if: ${{ always() && inputs.provider == 'gemini' }}
        run: |
          if [ -f state/gemini_usage.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -f state/gemini_usage.json
            if ! git diff --cached --quiet; then
              git commit -m 'Record Gemini quota usage [skip ci]'
              # Preserve concurrent commits made after workflow checkout.
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Install Kokoro and rendering dependencies
        if: ${{ inputs.render_video }}
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r requirements-tts.txt
          echo "HYPERFRAMES_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          node_modules/.bin/hyperframes browser ensure
      - name: Compile and render
        env:
          VOICE: ${{ inputs.voice }}
          RENDER_VIDEO: ${{ inputs.render_video }}
        run: |
          if [ "$RENDER_VIDEO" = 'true' ]; then
            python src/hyperframes_pipeline.py --plan build/video_plan.json --out-dir build/hyperframes --voice "$VOICE" --tts --render --output build/exports --fps 30
          else
            python src/hyperframes_pipeline.py --plan build/video_plan.json --out-dir build/hyperframes
          fi
      - name: Upload project and verified exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AetherRendering-AI-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            build/video_plan.json
            build/gemini_router_audit.json
            build/hyperframes/**
            build/exports/**
