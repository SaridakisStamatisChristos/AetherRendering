name: HyperFrames + Kokoro integration smoke test
# Rerun after adding required GSAP import.

on:
  push:
    branches: [main, "feature/production-stabilization-v1"]
    paths:
      - ".github/workflows/ai-render-smoke.yml"
      - "src/hyperframes_pipeline.py"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libsndfile1
          npm ci --no-audit --no-fund
          python -m pip install kokoro-onnx soundfile
          node_modules/.bin/hyperframes browser ensure
      - name: Validate Python and compile HTML/GSAP
        run: |
          python -m unittest discover -s tests -v
          python src/ai_director.py --provider demo --topic "How real video rendering works" --duration 12 --out build/video_plan.json
          python src/hyperframes_pipeline.py --plan build/video_plan.json --out-dir build/hyperframes
          cd build/hyperframes/vertical && "$GITHUB_WORKSPACE/node_modules/.bin/hyperframes" lint
      - name: Generate Kokoro voice and render two videos
        run: |
          python src/hyperframes_pipeline.py --plan build/video_plan.json --out-dir build/hyperframes --tts --render --output build/exports
      - name: Upload results even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HyperFrames-Kokoro-Smoke-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/video_plan.json
            build/hyperframes/**
            build/exports/**

      - name: Preserve verified demo MP4s in repository
        if: ${{ success() && github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p output/hyperframes_v2
          cp build/exports/vertical.mp4 output/hyperframes_v2/instagram.mp4
          cp build/exports/horizontal.mp4 output/hyperframes_v2/youtube.mp4
          cp build/exports/report.json output/hyperframes_v2/verification.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/hyperframes_v2
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified HyperFrames and Kokoro sample videos [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
