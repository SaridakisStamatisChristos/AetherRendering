<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AetherRendering — The Last Signal (engine comparison)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#050b1b;color:#edf7ff;font-family:Arial,sans-serif}
#root{width:1280px;height:720px;position:relative;overflow:hidden}
#scene{position:absolute;inset:0;overflow:hidden}
#scene svg{position:absolute;inset:0}
#title{position:absolute;top:95px;left:100px;font-weight:800;font-size:54px;letter-spacing:8px;opacity:0;text-shadow:0 0 24px #29b7ff}
#caption{position:absolute;bottom:90px;left:100px;font-weight:600;font-size:35px;letter-spacing:2px;opacity:0;text-shadow:0 0 15px #43f6ff}
</style></head>
<body><div id="root" data-composition-id="aether-render-compare" data-start="0" data-width="1280" data-height="720" data-duration="10" data-fps="24">
<section id="scene" class="clip" data-start="0" data-duration="10" data-track-index="1">
<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" aria-label="A robot discovers light in an empty futuristic city">
<defs>
 <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040713"/><stop offset="1" stop-color="#18354b"/></linearGradient>
 <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#182b39"/><stop offset="1" stop-color="#020511"/></linearGradient>
 <radialGradient id="cyan"><stop offset="0" stop-color="#eeffff" stop-opacity="1"/><stop offset=".17" stop-color="#74faff" stop-opacity=".85"/><stop offset=".5" stop-color="#3ab8ff" stop-opacity=".26"/><stop offset="1" stop-color="#4bd9ff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="url(#sky)"/>
__STARS__
<g id="distant">__DISTANT__</g>
<g id="nearer">__NEARER__</g>
<rect x="0" y="565" width="1280" height="155" fill="url(#road)"/>
<path d="M0 565 L1280 565" stroke="#39566a" stroke-width="4"/>
<g id="camera">
 <path d="M0 655 L1280 655" stroke="#355369" stroke-width="3" stroke-dasharray="100 58" opacity=".55"/>
 <path d="M700 565 L790 586 L822 604" stroke="#263c4b" stroke-width="5" fill="none"/>
 <g id="flash" opacity="0"><circle cx="720" cy="578" r="180" fill="url(#cyan)"/><circle cx="720" cy="578" r="78" fill="url(#cyan)"/></g>
 <circle id="artifact" cx="720" cy="576" r="4" fill="#cfffff" opacity="0"/>
 <g id="robot" transform="translate(120 518)">
  <ellipse cx="0" cy="88" rx="56" ry="11" fill="#020711" opacity=".65"/>
  <g stroke="#d5edff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
   <path id="leftleg" d="M-18 18 L-24 50 L-36 84"/><path id="rightleg" d="M18 18 L23 50 L31 84"/>
   <path id="leftarm" d="M-28 -68 L-51 -27 L-39 2"/><path id="rightarm" d="M28 -68 L48 -28 L39 0"/>
  </g>
  <rect x="-29" y="-82" width="58" height="105" rx="18" fill="#122539" stroke="#d5edff" stroke-width="7"/>
  <rect x="-40" y="-153" width="80" height="63" rx="21" fill="#d8f3ff"/>
  <rect x="-28" y="-139" width="56" height="31" rx="11" fill="#09273c"/>
  <circle cx="-14" cy="-123" r="5" fill="#64edff"/><circle cx="14" cy="-123" r="5" fill="#64edff"/>
  <rect x="-13" y="-34" width="26" height="11" rx="5" fill="#64edff" opacity=".9"/>
  <path d="M-23 -148 L-23 -165 M23 -148 L23 -165" stroke="#b7e6fa" stroke-width="5"/>
 </g>
 <path d="M620 626 L790 626" stroke="#2c4452" stroke-width="2" opacity=".6"/>
</g>
<rect x="0" y="0" width="1280" height="720" fill="#01101e" opacity=".1"/>
</svg>
<div id="title">THE LAST SIGNAL</div><div id="caption">Something was still alive.</div>
</section>
<audio id="comparison-soundtrack" class="clip" src="assets/voice/soundtrack.wav" data-start="0" data-duration="10" data-track-index="10" data-volume="1"></audio>
</div>
<script src="assets/vendor/gsap.min.js"></script>
<script>
(function(){
 const byId = id => document.getElementById(id);
 const linear = (frame,lo,hi,a,b) => Math.max(0,Math.min(1,(frame-lo)/(hi-lo)))*(b-a)+a;
 const clamp = x => Math.max(0,Math.min(1,x));
 function updateAt(frame) {
   frame = Math.max(0,Math.min(239,Math.round(frame)));
   let t = clamp(frame/130);
   // Exactly the Remotion test's out-cubic position ramp, then stop.
   let x = frame < 130 ? 120 + 460*(1-Math.pow(1-t,3)) : 580;
   const moving = frame < 130 ? 1 : 0;
   const stride = Math.sin(frame*.62)*moving;
   const sway = Math.abs(Math.sin(frame*.62))*5*moving;
   const look = linear(frame,144,176,0,15);
   const crouch = linear(frame,150,195,0,30);
   const arm = linear(frame,160,196,0,-48);
   const cameraX = frame<=180 ? linear(frame,0,180,0,-85) : linear(frame,180,239,-85,-145);
   byId('distant').setAttribute('transform',`translate(${cameraX*.3} 0)`);
   byId('nearer').setAttribute('transform',`translate(${cameraX*.62} 0)`);
   byId('camera').setAttribute('transform',`translate(${cameraX} 0)`);
   byId('robot').setAttribute('transform',`translate(${x} ${518+sway+crouch}) rotate(${look})`);
   byId('leftleg').setAttribute('d',`M-18 18 L${-24+26*stride} 50 L${-36+35*stride} 84`);
   byId('rightleg').setAttribute('d',`M18 18 L${23-26*stride} 50 L${31-35*stride} 84`);
   byId('leftarm').setAttribute('d',`M-28 -68 L${-51+12*stride} -27 L${-39+13*stride} 2`);
   byId('rightarm').setAttribute('d',`M28 -68 L${48-10*stride+arm*.4} -28 L${39-11*stride+arm} 0`);
   const reveal = linear(frame,88,135,0,1);
   const flash = (.75+Math.sin(frame*.11)*.25)*reveal;
   byId('flash').setAttribute('opacity',String(flash));
   byId('artifact').setAttribute('r',String(4+3*flash));
   byId('artifact').setAttribute('opacity',String(reveal));
   const titleIn=linear(frame,9,26,0,1);
   const titleOut=linear(frame,55,77,1,0);
   const endIn=linear(frame,170,205,0,1);
   const lastFade=linear(frame,224,239,1,0);
   byId('title').style.opacity=String(titleIn*titleOut*lastFade);
   byId('caption').style.opacity=String(endIn*lastFade);
   byId('caption').style.transform=`translateY(${(1-endIn)*18}px)`;
 }
 const clock={frame:0};
 const tl=gsap.timeline({paused:true});
 tl.to(clock,{frame:240,duration:10,ease:'none',onUpdate:()=>updateAt(clock.frame)},0);
 window.__timelines=window.__timelines||{};
 window.__timelines['aether-render-compare']=tl;
 updateAt(0);
})();
</script>
</body></html>
